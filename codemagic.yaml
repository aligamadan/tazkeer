workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Setup Gradle Wrapper and Build APK
        script: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
