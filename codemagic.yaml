workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Android Release APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
